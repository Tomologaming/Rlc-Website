<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLC // Initializing...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(15, 15, 22, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #ff3366, #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar-fill {
            transition: width 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-[#050508] text-gray-200 min-h-screen flex items-center justify-center font-sans overflow-hidden">

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#050508] px-6">
        
        <!-- Branding -->
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-black tracking-tighter mb-2 gradient-text">RLC SYSTEMS</h1>
            <p id="status-text" class="text-xs uppercase tracking-widest text-gray-500 animate-pulse">Establishing Connection...</p>
        </div>

        <!-- Progress -->
        <div class="w-full max-w-md space-y-4">
            <div class="flex justify-between text-[10px] uppercase font-bold tracking-widest text-gray-400">
                <span id="file-name">Initializing...</span>
                <span id="percent-val">0%</span>
            </div>
            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar-fill h-full bg-gradient-to-r from-pink-500 to-purple-500 w-0"></div>
            </div>
        </div>

        <div class="mt-8 max-w-xl text-center">
            <p class="text-sm text-gray-300">By continuing, you agree to our legal information and the use of this website.</p>
            <div class="mt-5 flex flex-col sm:flex-row items-center justify-center gap-3">
                <button id="continue-btn" class="px-5 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold hover:opacity-90 transition">Continue</button>
                <a href="/privacy-policy.html" class="px-5 py-3 rounded-xl border border-white/10 bg-white/5 text-gray-200 hover:bg-white/10 transition">Privacy Policy</a>
                <a href="/terms-and-conditions.html" class="px-5 py-3 rounded-xl border border-white/10 bg-white/5 text-gray-200 hover:bg-white/10 transition">Terms & Conditions</a>
            </div>
            <p id="countdown" class="mt-4 text-xs uppercase tracking-[0.2em] text-gray-500">Continuing automatically in 7 seconds</p>
        </div>
    </div>

    <script>
        const assets = [
            'https://cdn.tailwindcss.com'
        ];

        const progressBar = document.getElementById('progress-bar');
        const percentVal = document.getElementById('percent-val');
        const statusText = document.getElementById('status-text');
        const fileName = document.getElementById('file-name');
        const countdown = document.getElementById('countdown');
        const continueBtn = document.getElementById('continue-btn');

        const continueUrl = 'https://rlc.gt.tc';
        const totalCountdownSeconds = 7;
        let loaded = 0;
        let remainingSeconds = totalCountdownSeconds;
        let countdownInterval = null;

        function updateCountdown() {
            const suffix = remainingSeconds === 1 ? 'second' : 'seconds';
            countdown.textContent = `Continuing automatically in ${remainingSeconds} ${suffix}`;
        }

        function continueToSite() {
            clearInterval(countdownInterval);
            window.location.href = continueUrl;
        }

        async function initLoading() {
            if (assets.length === 0) {
                setTimeout(() => finish(), 2000);
                return;
            }

            for (const asset of assets) {
                try {
                    fileName.innerText = 'GET ' + asset.split('/').pop();
                    statusText.innerText = 'Fetching Assets...';
                    await fetch(asset, { mode: 'no-cors' });
                    loaded++;
                    const progress = (loaded / assets.length) * 100;
                    progressBar.style.width = progress + '%';
                    percentVal.innerText = Math.round(progress) + '%';
                } catch (e) {
                    loaded++;
                    const progress = (loaded / assets.length) * 100;
                    progressBar.style.width = progress + '%';
                    percentVal.innerText = Math.round(progress) + '%';
                }
            }
            finish();
        }

        function finish() {
            statusText.innerText = 'SYSTEM ONLINE';
            statusText.classList.remove('animate-pulse');
            fileName.innerText = 'Ready';
            progressBar.style.width = '100%';
            percentVal.innerText = '100%';
            updateCountdown();

            countdownInterval = setInterval(() => {
                remainingSeconds = Math.max(0, remainingSeconds - 1);
                updateCountdown();

                if (remainingSeconds === 0) {
                    clearInterval(countdownInterval);
                    continueToSite();
                }
            }, 1000);

            continueBtn.addEventListener('click', continueToSite);
        }

        window.onload = initLoading;
    </script>
</body>
</html>
