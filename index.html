<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLC // Initializing...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(15, 15, 22, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #ff3366, #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar-fill {
            transition: width 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-[#050508] text-gray-200 min-h-screen flex items-center justify-center font-sans overflow-hidden">

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#050508]">
        
        <!-- Branding -->
        <div class="mb-12 text-center">
            <h1 class="text-4xl font-black tracking-tighter mb-2 gradient-text">RLC SYSTEMS</h1>
            <p id="status-text" class="text-xs uppercase tracking-widest text-gray-500 animate-pulse">Establishing Connection...</p>
        </div>

        <!-- Progress -->
        <div class="w-80 space-y-4">
            <div class="flex justify-between text-[10px] uppercase font-bold tracking-widest text-gray-400">
                <span id="file-name">Initializing...</span>
                <span id="percent-val">0%</span>
            </div>
            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar-fill h-full bg-gradient-to-r from-pink-500 to-purple-500 w-0"></div>
            </div>
        </div>
    </div>

    <script>
        // Trage hier deine echten Dateien ein (CSS, JS, Bilder)
        const assets = [
            'https://cdn.tailwindcss.com'
        ];

        const progressBar = document.getElementById('progress-bar');
        const percentVal = document.getElementById('percent-text');
        const statusText = document.getElementById('status-text');
        const fileName = document.getElementById('file-name');

        let loaded = 0;

        async function initLoading() {
            if (assets.length === 0) {
                setTimeout(() => finish(), 2000);
                return;
            }

            for (const asset of assets) {
                try {
                    fileName.innerText = "GET " + asset.split('/').pop();
                    statusText.innerText = "Fetching Assets...";
                    
                    await fetch(asset, { mode: 'no-cors' });
                    
                    loaded++;
                    let progress = (loaded / assets.length) * 100;
                    progressBar.style.width = progress + "%";
                    percentVal.innerText = Math.round(progress) + "%";
                } catch (e) {
                    loaded++; 
                }
            }
            finish();
        }

        function finish() {
            statusText.innerText = "SYSTEM ONLINE";
            statusText.classList.remove('animate-pulse');
            setTimeout(() => {
                // Weiterleitung zur echten Hauptseite
                window.location.replace("https://rlc.gt.tc");
            }, 500);
        }

        window.onload = initLoading;
    </script>
</body>
</html>
